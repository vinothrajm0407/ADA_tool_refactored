[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Pure unit tests — no I/O, no network
    integration: Flask test client tests — no real DB/network
    security: Security-specific scenarios
    slow: Tests that take >5s (Playwright, real network)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
